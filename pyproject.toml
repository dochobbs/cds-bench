[project]
name = "cds-bench"
version = "0.1.0"
description = "Internal family-medicine CDS benchmark + public-release tooling (145 cases; 29 public / 116 held out)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Anchor rootdir here so `python -m pytest` discovers scripts/ as importable packages.
testpaths = ["tests"]
