[project]
name = "cds-bench"
version = "0.1.0"
description = "A family-medicine CDS benchmark + public-release tooling (135 cases; 27 public / 108 held out)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Anchor rootdir here so `python -m pytest` discovers scripts/ as importable packages.
testpaths = ["tests"]
